[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "algebraic-physics"
version = "0.2
description = "A project for math and geometry formulas"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=2.4.6"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

